<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查看图书信息</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>图书借阅系统<span>后台管理</span></h1>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <h2 class="card-title">查看图书信息</h2>

      <!-- 考卷要求本页所有字段均为可读不可写 -->
      <div class="form-grid">
        <div class="field">
          <label for="bookCode">图书编号</label>
          <input type="text" id="bookCode" readonly>
        </div>
        <div class="field">
          <label for="bookName">图书名称</label>
          <input type="text" id="bookName" readonly>
        </div>
        <div class="field">
          <label for="bookType">图书类型</label>
          <input type="text" id="bookType" readonly>
        </div>
        <div class="field">
          <label for="bookAuthor">作者</label>
          <input type="text" id="bookAuthor" readonly>
        </div>
        <div class="field">
          <label for="publishPress">出版社</label>
          <input type="text" id="publishPress" readonly>
        </div>
        <div class="field">
          <label for="borrowed">是否借阅</label>
          <input type="text" id="borrowed" readonly>
        </div>
        <div class="field">
          <label for="createdBy">入库人</label>
          <input type="text" id="createdBy" readonly>
        </div>
        <div class="field">
          <label for="creationTime">入库时间</label>
          <input type="text" id="creationTime" readonly>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn" id="backBtn">返回</button>
      </div>
    </section>
  </main>

  <script src="vendor/jquery.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
